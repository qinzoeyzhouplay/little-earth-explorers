<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Earth Explorers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage"></div>
<div id="diag" style="position:fixed;left:8px;bottom:6px;right:8px;z-index:99;color:#fff;font:14px sans-serif;opacity:.8;pointer-events:none"></div>
<script>
/* If the game cannot start, show a small note for grown-ups instead of a blank screen. */
window.__report = function (m) { var d = document.getElementById('diag'); if (d) d.textContent += ' [' + m + ']'; };
window.addEventListener('error', function (e) { window.__report((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { window.__report('promise: ' + (e.reason && e.reason.message || e.reason)); });
if (location.protocol === 'file:') window.__report('Open through a web address (http/https), not as a local file');
</script>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
